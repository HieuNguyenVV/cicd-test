services:
  app:
    image: ghcr.io/${GITHUB_USERNAME:-hieunguyenvv}/cicd-test:${IMAGE_TAG:-latest}
    container_name: cicd-test
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
