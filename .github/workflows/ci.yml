name: Go CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop
permissions:
  contents: read

jobs:
  # Lint the code
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt errors in the following files:"
            echo "$files"
            exit 1
          fi
      - name: Go vet
        run: go vet ./...

  # Run tests
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Run coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Show coverage
        run: go tool cover -func=coverage.out

  # Build the binary
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o app ./cmd/server

      - name: Verify binary
        run:
          file app
          ls -lh app
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: go-app
          path: app

  #Security scan
  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Check vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  #docker
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build Docker image
        run: |
          docker build \
          -t cicd-test:${{ github.sha }} \
          .
        
      - name: Test Docker image
        run: |
          docker run -d --name cicd-test -p 8080:8080 cicd-test:${{ github.sha }}
          trap 'docker rm -f cicd-test' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          docker logs cicd-test
          exit 1

  #final
  final:
    name: Final
    runs-on: ubuntu-latest
    needs: 
      - lint
      - test
      - build
      - security
      - docker

    steps:
      - name: CI passed
        run: echo "CI passed"